name: build

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: install deps
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q clang llvm libbpf-dev libelf-dev zlib1g-dev vim-common \
            linux-tools-common linux-tools-generic
          # bpftool lives in a versioned dir; expose it on PATH for vmlinux.h
          sudo ln -sf /usr/lib/linux-tools/*/bpftool /usr/local/bin/bpftool

      - name: build
        run: make

      # ubuntu >= 23.10 restricts unprivileged user namespaces via
      # AppArmor; the sandbox needs CLONE_NEWUSER.  No-op on runners
      # where the knob doesn't exist.
      - name: allow unprivileged user namespaces
        run: sudo sysctl kernel.apparmor_restrict_unprivileged_userns=0 || true

      # the full regression suite (tests/run.sh).  Passwordless sudo on
      # the runner unlocks the privileged tiers: agentmon probes run;
      # the agentlsm tier skips unless the runner kernel has "bpf" in
      # /sys/kernel/security/lsm (Ubuntu's default LSM list doesn't).
      - name: make check
        run: make check 2>&1 | tee check.log

      - name: upload check log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: check-log
          path: check.log
